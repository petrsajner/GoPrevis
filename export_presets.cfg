[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="samples/*.bvh,samples/*.md,LICENSES/*,assets/library/*.bytes,assets/content/manifests/*.json,assets/content/motions/human/*.bvh,assets/content/animals/*.bytes,assets/content/props/*/*.bytes"
exclude_filter=".tools/*,build/*,output/*,tests/*,tools/*,assets/content/*/validation.json,assets/content/*/provenance.json,assets/content/*/preview.png,*.md"
export_path="build/Previs-0.11.0-Windows/Previs.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug="res://.tools/templates/windows_debug_x86_64.exe"
custom_template/release="res://.tools/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/previs.svg"
application/file_version="0.11.0.0"
application/product_version="0.11.0.0"
application/product_name="Previs"
application/file_description="Previs - film shot planning prototype"
application/copyright="Petr Sajner"
dotnet/include_scripts_content=false
dotnet/embed_build_outputs=false
